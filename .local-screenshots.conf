# Screenshot pipeline config (zsh-sourced). Read by scripts/update-screenshots.sh, which frames
# with a caption per scene (Tools/frame_screenshots.mjs + docs/appstore-screenshots/captions.json)
# and uploads through ../_shared/screenshots/asc-screenshots.mjs.

CAPTURE_CMD="./Tools/capture_screenshots.sh"
SCREENSHOTS_DIR="screenshots"
BUNDLE_ID="com.blainemiller.ScriptureAlone"

# "<rawKey>|<.monkr path>|<ASC display type>"
# iPhone: captured on the 17 Pro Max, framed on a 1284x2778 canvas = APP_IPHONE_65. (A
#   1320x2868 frame is refused by that slot — see the 6.5" trap in the shared README.)
# iPad: iPad Pro 13-inch (M5), 2064x2752 = APP_IPAD_PRO_3GEN_129. The Mac runs this iPad app
#   ("Designed for iPad"); there is no macOS platform, so no APP_DESKTOP set.
# Watch: Series 11 46mm simulator, 416x496 = APP_WATCH_SERIES_10 exactly. Watch sets ride the
#   IOS version (the watch app is embedded in the iOS app).
DEVICES=(
  "iphone-6.9|docs/appstore-screenshots/ScriptureAlone-iphone.monkr|APP_IPHONE_65"
  "ipad-13|docs/appstore-screenshots/ScriptureAlone-ipad.monkr|APP_IPAD_PRO_3GEN_129"
  "watch-46mm|docs/appstore-screenshots/ScriptureAlone-watch.monkr|APP_WATCH_SERIES_10"
)

# iPhone Duo (cover + inner share ONE ASC slot, APP_IPHONE_DUO) — framed/merged/uploaded by
# ../_shared/duo-screenshots.sh from Tools/capture_duo.sh. Captures use the BSB (never the NASB).
DUO_COVER_MONKR="docs/appstore-screenshots/ScriptureAlone-duo-cover.monkr"
DUO_INNER_MONKR="docs/appstore-screenshots/ScriptureAlone-duo-inner.monkr"

# Each screen ONCE — opened (inner) or folded (cover), never both (10 scenes; the set caps at 10).
# Wide-canvas screens (two-column reader, the inspector panels, the map, the appearance popover) are
# shown opened; sheets and the verse image are shown folded.
DUO_PLAN=(01:inner 02:cover 03:inner 04:inner 05:cover 06:inner 07:cover 08:inner 09:cover 10:cover)
