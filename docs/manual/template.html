<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<style>
  /* A small book page: reads comfortably on a phone and prints on half a sheet. */
  @page {
    size: 6in 9in; margin: 0.55in 0.5in 0.6in;
    @bottom-center { content: counter(page); font: 8pt -apple-system, sans-serif; color: #9a8f84; }
  }
  @page :first { margin: 0; @bottom-center { content: none; } }

  :root {
    --ink: #2a2420;
    --muted: #6f655c;
    --accent: #a0662a;
    --accent-soft: #f4e6d4;
    --paper: #ffffff;
    --rule: #e6ddd2;
    --panel: #f3efe9;
    --ui: #ffffff;
  }
  * { box-sizing: border-box; }
  /* data-only (docs/manual/README.md): the PDF is the iPhone edition plus PDF-only passages, so a
     passage marked only for other outputs is hidden. */
  [data-only]:not([data-only~="pdf"]):not([data-only~="apple"]):not([data-only~="iphone"]) { display: none !important; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    margin: 0; color: var(--ink); background: var(--paper);
    font: 10.5pt/1.5 "Iowan Old Style", "Hiragino Mincho ProN", "Songti SC", "AppleMyungjo", Georgia, serif;
    hyphens: auto; -webkit-hyphens: auto;
  }
  :lang(ja) body, :lang(zh-Hans) body, :lang(ko) body { hyphens: manual; line-height: 1.7; }
  /* Each CJK language gets its own faces first, so no character falls back to another script's font. */
  :lang(zh-Hans) body { font-family: "Songti SC", "STSong", serif; }
  :lang(ja) body { font-family: "Hiragino Mincho ProN", "YuMincho", serif; }
  :lang(ko) body { font-family: "AppleMyungjo", "Apple SD Gothic Neo", serif; }
  :lang(zh-Hans) :is(h1, h2, h3, .ui, .step-num, .cover, figcaption, .toc, .tag, .note-label, .mock, kbd) { font-family: -apple-system, "PingFang SC", sans-serif; }
  :lang(ja) :is(h1, h2, h3, .ui, .step-num, .cover, figcaption, .toc, .tag, .note-label, .mock, kbd) { font-family: -apple-system, "Hiragino Sans", sans-serif; }
  :lang(ko) :is(h1, h2, h3, .ui, .step-num, .cover, figcaption, .toc, .tag, .note-label, .mock, kbd) { font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }
  :lang(zh-Hans) ol.steps > li::before { font-family: -apple-system, "PingFang SC", sans-serif; }
  h1, h2, h3, .ui, .step-num, .cover, figcaption, .toc, .tag, .note-label {
    font-family: -apple-system, "SF Pro Text", "Hiragino Sans", "PingFang SC", "Apple SD Gothic Neo", "Helvetica Neue", sans-serif;
  }

  /* Cover */
  .cover {
    height: 9in; width: 6in; padding: 1in 0.6in 0.6in; position: relative; overflow: hidden;
    background: linear-gradient(170deg, #fbe7c8 0%, #f2c58f 38%, #b86a2c 100%);
    color: #2b1a0c; page-break-after: always; display: flex; flex-direction: column;
  }
  .cover .sun {
    position: absolute; width: 5in; height: 5in; border-radius: 50%; right: -1.6in; top: 2.9in;
    background: radial-gradient(circle, rgba(255,247,230,0.95) 0%, rgba(255,226,180,0.55) 45%, rgba(255,226,180,0) 70%);
  }
  .cover .eyebrow { font-size: 9pt; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.75; }
  .cover h1 { font-size: 30pt; line-height: 1.1; margin: 0.12in 0 0.1in; font-weight: 700; letter-spacing: -0.01em; }
  .cover .subtitle { font-size: 13pt; max-width: 4in; opacity: 0.85; }
  .cover .phones { margin-top: auto; display: flex; gap: 0.18in; align-items: flex-end; position: relative; }
  .cover .phones img { width: 1.55in; }
  .cover .phones img:nth-child(2) { width: 1.75in; }
  .cover .edition { position: relative; font-size: 8.5pt; margin-top: 0.25in; opacity: 0.8; }

  /* Contents */
  .toc { page-break-after: always; }
  .toc h2 { margin-top: 0; }
  .toc ol { list-style: none; padding: 0; margin: 0; counter-reset: ch; }
  .toc li { counter-increment: ch; display: flex; gap: 0.12in; padding: 0.075in 0; border-bottom: 1px solid var(--rule); font-size: 10.5pt; }
  .toc li::before { content: counter(ch); color: var(--accent); font-weight: 700; width: 0.25in; }
  .toc li span { color: var(--muted); font-size: 9pt; margin-left: auto; text-align: right; }

  /* Chapters */
  section.chapter { page-break-before: always; counter-increment: chapter; }
  section.chapter:first-of-type { page-break-before: auto; }
  body { counter-reset: chapter; }
  h2 {
    font-size: 18pt; line-height: 1.2; margin: 0 0 0.12in; color: var(--ink); font-weight: 700;
  }
  h2::before {
    content: counter(chapter); display: block; font-size: 9pt; font-weight: 700; letter-spacing: 0.15em;
    color: var(--accent); margin-bottom: 0.04in;
  }
  .toc h2::before { content: none; }
  .lede { font-size: 11.5pt; color: var(--muted); margin: 0 0 0.18in; }
  h3 { font-size: 11pt; margin: 0.2in 0 0.05in; color: var(--ink); break-after: avoid; }
  p { margin: 0 0 0.09in; }
  ul, ol { margin: 0 0 0.1in; padding-left: 0.22in; }
  li { margin: 0 0 0.04in; }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(160,102,42,0.35); word-break: break-word; }
  .ui {
    font-size: 9pt; font-weight: 600; background: var(--panel); border: 1px solid var(--rule);
    border-radius: 4px; padding: 0 4px; white-space: nowrap;
  }
  kbd { font: 600 8.5pt -apple-system, sans-serif; border: 1px solid #cbbfb2; border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: #fff; }

  /* A screenshot beside the words */
  .feature { display: flex; gap: 0.2in; align-items: flex-start; break-inside: avoid; margin: 0.08in 0 0.14in; }
  .feature.flip { flex-direction: row-reverse; }
  .feature .text { flex: 1; min-width: 0; }
  figure { margin: 0; flex: 0 0 auto; text-align: center; break-inside: avoid; }
  figure img.phone { width: 1.75in; display: block; }
  figure img.watch { width: 1.3in; display: block; margin: 0 auto; }
  figcaption { font-size: 7.5pt; color: var(--muted); margin-top: 0.05in; max-width: 1.7in; }

  /* Numbered steps */
  ol.steps { list-style: none; padding: 0; counter-reset: step; margin: 0.08in 0 0.12in; }
  ol.steps > li { counter-increment: step; position: relative; padding-left: 0.36in; margin-bottom: 0.1in; break-inside: avoid; }
  ol.steps > li::before {
    content: counter(step); position: absolute; left: 0; top: 0.01in; width: 0.24in; height: 0.24in; border-radius: 50%;
    background: var(--accent); color: #fff; font: 700 9pt/0.24in -apple-system, sans-serif; text-align: center;
  }

  /* Callouts */
  .note, .tip, .warn { border-radius: 8px; padding: 0.1in 0.14in; margin: 0.12in 0; break-inside: avoid; font-size: 9.5pt; }
  .tip { background: var(--accent-soft); }
  .note { background: var(--panel); }
  .warn { background: #fbeaea; }
  .note-label { display: block; font-size: 7.5pt; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.03in; }
  .warn .note-label { color: #a33; }

  /* Drawn app screens, so a setup step can be shown in any language */
  .mock {
    width: 2.5in; flex: 0 0 auto; background: #f2f1f6; border-radius: 0.16in; border: 3px solid #1b1714;
    padding: 0.1in 0.08in 0.12in; font: 8pt/1.35 -apple-system, "Hiragino Sans", "PingFang SC", "Apple SD Gothic Neo", sans-serif;
    color: #111; break-inside: avoid;
  }
  .mock .bar { display: flex; justify-content: space-between; align-items: center; font-weight: 600; margin: 0 0.04in 0.08in; }
  .mock .bar .btn { color: var(--accent); font-weight: 500; }
  .mock .bar .btn.bold { font-weight: 700; }
  .mock .head { text-transform: uppercase; font-size: 6.5pt; color: #6d6d72; margin: 0.06in 0.08in 0.03in; letter-spacing: 0.02em; }
  .mock .group { background: #fff; border-radius: 8px; overflow: hidden; }
  .mock .row { padding: 0.055in 0.09in; border-bottom: 0.5px solid #d8d8dc; display: flex; gap: 0.06in; align-items: center; }
  .mock .row:last-child { border-bottom: none; }
  .mock .row.link { color: var(--accent); }
  .mock .row.field { color: #b0b0b5; }
  .mock .row.hl { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; background: var(--accent-soft); color: #111; }
  .mock .foot { font-size: 6.5pt; color: #6d6d72; margin: 0.03in 0.08in 0.06in; }
  .mock .ico { width: 0.14in; text-align: center; }
  .mock .check { margin-left: auto; color: var(--accent); font-weight: 700; }
  .mock .sub { display: block; color: #8e8e93; font-size: 6.5pt; }

  table.facts { width: 100%; border-collapse: collapse; font-size: 9pt; margin: 0.08in 0 0.14in; break-inside: avoid; }
  table.facts th, table.facts td { text-align: left; padding: 0.05in 0.06in; border-bottom: 1px solid var(--rule); vertical-align: top; }
  table.facts th { font-family: -apple-system, sans-serif; font-size: 8pt; color: var(--muted); font-weight: 600; }
  .tag { display: inline-block; font-size: 7pt; font-weight: 700; border-radius: 10px; padding: 0 6px; background: var(--accent-soft); color: var(--accent); letter-spacing: 0.04em; }

  .closing { text-align: center; color: var(--muted); font-size: 7.5pt; line-height: 1.4; margin-top: 0.15in; }
</style>
</head>
<body>
{{content}}
</body>
</html>
