name: ScriptureAlone
options:
  bundleIdPrefix: com.blainemiller
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "26.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

settings:
  base:
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: "8ZVSPZYSVF"
    CODE_SIGN_STYLE: Automatic
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    # The xattr-strip postCompileScript needs script sandboxing off.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "1.1.4"
    CURRENT_PROJECT_VERSION: "1"
    # Intel Macs and Intel simulators are out of scope.
    "ARCHS[sdk=macosx*]": arm64
    "EXCLUDED_ARCHS[sdk=*simulator*]": x86_64

packages:
  # Shared feedback / rating / "other apps" kit.
  MillerKit:
    url: https://github.com/blaineam/MillerKit
    from: "1.3.1"
  ScriptureAloneCore:
    path: ScriptureAloneCore

targets:
  ScriptureAlone:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ScriptureAlone
        excludes:
          - "Resources/Info.plist"
          - "Resources/*.entitlements"
          # No Bible database is ever an app resource. The ASV ships sealed (its store is the source
          # the packaging tool reads); every other translation, the big-8 locales' included
          # (docs/localization.md), is an on-demand pack. A pattern, not a list: a new translation
          # added to Tools/build_bibles.py must not quietly add 15 MB to the app.
          - "Resources/Bibles/*.sqlite"
          # Apple-hosted Background Assets packs (`onDemand`), not app resources (Tools/asset-packs).
          # Kept in the repository as the packs' sources, and copied into Debug builds only — see
          # below. The translation a fresh install opens to can't wait on delivery — an `essential`
          # ASV pack left App Review's iPad on an endless spinner (1.0.0 build 40) — so that one, the
          # NASB 2020 (Resources/Packages/NASB2020.sabible, copied in by CI), stays in the app.
          - "Resources/Study/Study.sqlite"
          - "Resources/Study/Interlinear.sqlite"
          # Since 1.1.1 the ASV is an on-demand pack too, and the NASB 1995 is one from the start:
          # only the NASB 2020, the default, is in the binary. Their signing keys stay in the app.
          - "Resources/Packages/ASV.sabible"
          - "Resources/Packages/NASB1995.sabible"
    dependencies:
      - package: MillerKit
      - package: ScriptureAloneCore
        product: ScriptureAloneCore
      # Home/Lock Screen and Mac desktop widgets (embedded on both platforms).
      - target: ScriptureAloneWidgets
      # Embedded into the app *wrapper*, not the products directory. XcodeGen's default for an
      # extensionkit-extension is `$(EXTENSIONS_FOLDER_PATH)` under the products directory, which
      # during `xcodebuild archive` is not where the app is installed — the appex lands in a stray
      # `Scripture Alone.app` beside the real one and the archive ships without it. Xcode says so
      # only as a warning; App Store Connect refuses the build.
      - target: ScriptureAloneAssets
        copy:
          destination: wrapper
          subpath: Extensions
      # The Apple Watch app rides inside the iOS app only.
      - target: ScriptureAloneWatch
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blainemiller.ScriptureAlone
        PRODUCT_NAME: Scripture Alone
        INFOPLIST_FILE: ScriptureAlone/Resources/Info.plist
        # The Icon Composer document ScriptureAlone/Resources/AppIcon.icon
        # (picked up by the `ScriptureAlone` source path; its layers come from
        # Tools/generate_icon.py). A watchOS target reuses it by listing the
        # same file in its sources with this same setting.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        # Mac users get the iPad app ("Designed for iPad") — no macOS platform in App Store Connect.
        # The native macOS destination stays buildable so its code does not rot, but it is not shipped.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_ENTITLEMENTS: ScriptureAlone/Resources/ScriptureAlone.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": ScriptureAlone/Resources/ScriptureAlone-macOS.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
    postCompileScripts:
      # Development builds have no asset packs — those exist only for App Store and TestFlight
      # builds — so a build run from Xcode would open with no Bible at all. In Debug only, the pack
      # sources are copied into the bundle and AssetLibrary installs from there. Release never
      # carries them: a bundled fallback in Release would hide a broken asset-pack path.
      # Runs before the xattr strip below, which then cleans these copies too.
      - name: Copy asset-pack sources into Debug builds
        basedOnDependencyAnalysis: false
        script: |
          [ "$CONFIGURATION" = "Debug" ] || exit 0
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          R="$SRCROOT/ScriptureAlone/Resources"
          for f in Packages/ASV.sabible Bibles/BSB.sqlite Bibles/KJV.sqlite Bibles/CUVS.sqlite Bibles/BUNGO.sqlite Bibles/LUT1912.sqlite Bibles/LSG.sqlite Bibles/RVR1909.sqlite Bibles/KRV.sqlite Bibles/BLIVRE.sqlite Bibles/RIV1927.sqlite Study/Study.sqlite Study/Interlinear.sqlite; do
            cp -f "$R/$f" "$DEST/"
          done
          # The licensed NASB 1995, when a developer has its package locally (never committed).
          [ -f "$R/Packages/NASB1995.sabible" ] && cp -f "$R/Packages/NASB1995.sabible" "$DEST/"
          # The sample sermon slide, for the UI tests' `-uiTestSlide` (the simulator has no camera).
          cp -f "$SRCROOT/docs/appstore-screenshots/sample-slide.jpg" "$DEST/"
          true
      - name: Strip xattrs (codesign workaround)
        # Must run on EVERY build: iCloud Documents re-tags files with
        # com.apple.provenance between builds, and a stamp-file output lets
        # Xcode skip this phase on incremental builds while codesign still
        # reruns — which then fails with "resource fork, Finder information,
        # or similar detritus not allowed".
        basedOnDependencyAnalysis: false
        script: |
          find "$CODESIGNING_FOLDER_PATH" -exec xattr -c {} + 2>/dev/null
          true

  # The Background Assets downloader extension. It has no behaviour — adopting
  # `StoreDownloaderExtension` opts into the system's own downloader — but the framework requires
  # it to exist, and `AssetPackManager` treats its absence as a programmer error.
  ScriptureAloneAssets:
    # ExtensionKit, so Xcode embeds it in Extensions/ rather than PlugIns/. Declared as
    # `app-extension` it builds locally and then fails App Store export.
    type: extensionkit-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ScriptureAloneAssets
        excludes:
          - "Info.plist"
          - "*.entitlements"
    # Apple-Hosted Background Assets requires the app and its downloader extension to share an app
    # group — the system coordinates between the two through it. The app declares the same group,
    # plus BAAppGroupID/BAHasManagedAssetPacks/BAUsesAppleHosting in its Info.plist.
    #
    # The group MUST be listed under `properties`. XcodeGen writes the entitlements file from this
    # block on every `xcodegen generate`; with only a `path` it writes an empty <dict/>, silently
    # erasing anything added to the file by hand. That is what stripped the app-group entitlement
    # from this extension and produced ITMS-90958 build after build — while the widgets, which
    # declare `properties`, kept theirs.
    entitlements:
      path: ScriptureAloneAssets/ScriptureAloneAssets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.blainemiller.ScriptureAlone
    dependencies:
      - sdk: BackgroundAssets.framework
      - sdk: StoreKit.framework
      # Without it the App Intents metadata step warns "no AppIntents.framework dependency".
      - sdk: AppIntents.framework
    info:
      path: ScriptureAloneAssets/Info.plist
      properties:
        CFBundleDisplayName: Scripture Alone Assets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # No EXPrincipalClass. `@main` on AssetDownloader emits a `__swift5_entry` section, and
        # App Store Connect rejects the build when both are present:
        #   ITMS-90979: Disallowed Info.plist key — The EXPrincipalClass and
        #   EXExtensionPrincipalClass keys aren't allowed … because the __swift5_entry section is
        #   detected in the Mach-O header.
        # The Swift entry point is the principal class; naming it again is the contradiction.
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.background-asset-downloader-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blainemiller.ScriptureAlone.assets
        PRODUCT_NAME: ScriptureAloneAssets
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    postCompileScripts:
      - name: Strip xattrs (codesign workaround)
        basedOnDependencyAnalysis: false
        script: |
          find "$CODESIGNING_FOLDER_PATH" -exec xattr -c {} + 2>/dev/null
          true

  # Widgets for iOS (Home + Lock Screen) and macOS (desktop / Notification Center). They read
  # the bundled Verse of the Day list and the JSON snapshot the app writes to the App Group;
  # they never open the Bible databases or the SwiftData store.
  ScriptureAloneWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ScriptureAloneWidgets
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - ScriptureAlone/Shared/AppGroup.swift
      - ScriptureAlone/Shared/DailyVerseLibrary.swift
      - ScriptureAlone/Shared/DailyVerses.json
    dependencies:
      - package: ScriptureAloneCore
        product: ScriptureAloneCore
    info:
      path: ScriptureAloneWidgets/Info.plist
      properties:
        CFBundleDisplayName: Scripture Alone
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ScriptureAloneWidgets/ScriptureAloneWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.blainemiller.ScriptureAlone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blainemiller.ScriptureAlone.Widgets
        PRODUCT_NAME: ScriptureAloneWidgets
        # Timeline providers and intents run off the main actor; views stay @MainActor via View.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
    postCompileScripts:
      - name: Strip xattrs (codesign workaround)
        basedOnDependencyAnalysis: false
        script: |
          find "$CODESIGNING_FOLDER_PATH" -exec xattr -c {} + 2>/dev/null
          true

  # Apple Watch app (watchOS 26+), standalone-capable. Bundles a compact ASV
  # (Tools/build_companion_data.py) and syncs favorites, highlights and notes through the same
  # private CloudKit container as the phone via SwiftData — it shares Models.swift so the
  # schema is identical.
  ScriptureAloneWatch:
    type: application
    platform: watchOS
    sources:
      - path: ScriptureAloneWatch
        excludes:
          - "Info.plist"
          - "*.entitlements"
          # Since 1.1.1 the watch carries only the NASB 2020; the phone sends the ASV, BSB, KJV and the
          # rest when the reader uses them (WatchLink). The editions stay in the repository as
          # build_companion_data.py's output, for Wear OS's tests.
          - "Resources/*-Watch.sqlite"
      # The sealed NASB 2020 (copied in by CI, never committed) and the signing keys of every sealed
      # translation the watch may hold. The ASV and NASB 1995 packages themselves come from the phone.
      - path: ScriptureAlone/Resources/Packages
        excludes:
          - "ASV.sabible"
          - "NASB1995.sabible"
      # The build's secret seed, which opens the licensed packages (written by ci_post_clone.sh).
      - ScriptureAlone/Generated/ContentKeySeed.swift
      - ScriptureAlone/Persistence/Models.swift
      - ScriptureAlone/Shared/DemoLibrary.swift
      # DEBUG-only `-UITestMode` (ScriptureAloneWatchUITests).
      - ScriptureAlone/App/UITestMode.swift
      - ScriptureAlone/Shared/DailyVerseLibrary.swift
      - ScriptureAlone/Shared/DailyVerses.json
      # Phone ↔ watch vocabulary for translation sync (WatchLink / WatchPhoneLink).
      - ScriptureAlone/Shared/WatchLinkKeys.swift
      # Where the complications read the watch's translation (`WatchBible.publishVerseOfDay`).
      - ScriptureAlone/Shared/AppGroup.swift
      - ScriptureAloneWidgets/VerseStyling.swift
      # The same Icon Composer document as the phone and Mac; it declares watchOS circles.
      - ScriptureAlone/Resources/AppIcon.icon
      - ScriptureAlone/Resources/Assets.xcassets
    dependencies:
      - package: ScriptureAloneCore
        product: ScriptureAloneCore
      - target: ScriptureAloneWatchWidgets
      # Without it the App Intents metadata step warns "no AppIntents.framework dependency".
      - sdk: AppIntents.framework
    info:
      path: ScriptureAloneWatch/Info.plist
      properties:
        CFBundleDisplayName: Scripture Alone
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.blainemiller.ScriptureAlone
        WKRunsIndependentlyOfCompanionApp: true
        CFBundleURLTypes:
          - CFBundleURLName: com.blainemiller.ScriptureAlone.watchkitapp
            CFBundleURLSchemes: [scripturealone]
        # Speak renders to a file and plays it with AVAudioPlayer; the watch speaker route
        # needs the audio background mode.
        UIBackgroundModes: [audio]
    entitlements:
      path: ScriptureAloneWatch/ScriptureAloneWatch.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.blainemiller.ScriptureAlone
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.com.blainemiller.ScriptureAlone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blainemiller.ScriptureAlone.watchkitapp
        PRODUCT_NAME: Scripture Alone
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    postCompileScripts:
      # In Debug only, the BSB's watch edition, which `-UITestMode` installs as if the phone had sent
      # it (ScriptureAloneWatchUITests): a UI test never depends on the licensed translation the
      # watch ships. Release never carries it — the editions come from the phone.
      - name: Copy the BSB watch edition into Debug builds
        basedOnDependencyAnalysis: false
        script: |
          [ "$CONFIGURATION" = "Debug" ] || exit 0
          cp -f "$SRCROOT/ScriptureAloneWatch/Resources/BSB-Watch.sqlite" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/"
          true
      - name: Strip xattrs (codesign workaround)
        basedOnDependencyAnalysis: false
        script: |
          find "$CODESIGNING_FOLDER_PATH" -exec xattr -c {} + 2>/dev/null
          true

  # Watch face complications (WidgetKit accessory families).
  ScriptureAloneWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: ScriptureAloneWatchWidgets
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - ScriptureAloneWidgets/VerseOfDayShared.swift
      - ScriptureAlone/Shared/AppGroup.swift
      - ScriptureAloneWidgets/VerseStyling.swift
      - ScriptureAlone/Shared/DailyVerseLibrary.swift
      - ScriptureAlone/Shared/DailyVerses.json
    dependencies:
      - package: ScriptureAloneCore
        product: ScriptureAloneCore
    info:
      path: ScriptureAloneWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Scripture Alone
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ScriptureAloneWatchWidgets/ScriptureAloneWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.blainemiller.ScriptureAlone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blainemiller.ScriptureAlone.watchkitapp.Complications
        PRODUCT_NAME: ScriptureAloneWatchWidgets
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    postCompileScripts:
      - name: Strip xattrs (codesign workaround)
        basedOnDependencyAnalysis: false
        script: |
          find "$CODESIGNING_FOLDER_PATH" -exec xattr -c {} + 2>/dev/null
          true

  # Unit tests for the app layer (Swift Testing), hosted in the app on iOS and macOS. The pure
  # logic lives in ScriptureAloneCore and is tested there (`swift test`); these cover what only
  # the app has: the SwiftData models, settings and import sync, asset packs, sealed translations,
  # the reader model and the App Intents. The scheme passes `-inMemoryStore`, so the host app never
  # opens the reader's store, and an unsigned build never reaches CloudKit (`FamilyCloud.isEntitled`).
  ScriptureAloneTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ScriptureAloneTests
      # The widgets' timeline logic, which lives in the extension (WidgetTests).
      - ScriptureAloneWidgets/VerseOfDayShared.swift
      - ScriptureAloneWidgets/VerseStyling.swift
      - ScriptureAlone/Shared/AppGroup.swift
      - ScriptureAlone/Shared/DailyVerseLibrary.swift
      # The App Store Connect asset-pack manifests, which AssetPackTests checks the app against.
      - path: Tools/asset-packs
        type: folder
        buildPhase: resources
    dependencies:
      - target: ScriptureAlone
      - package: ScriptureAloneCore
        product: ScriptureAloneCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blainemiller.ScriptureAloneTests
        GENERATE_INFOPLIST_FILE: YES
        # The host's product name has a space ("Scripture Alone"), which XcodeGen's derived
        # TEST_HOST (from the target name) does not know.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Scripture Alone.app/Scripture Alone"
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Scripture Alone.app/Contents/MacOS/Scripture Alone"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  # UI tests (XCUITest) for iPhone and iPad — and so for the Mac, which runs the iPad app. The app
  # is launched with `-UITestMode` (ScriptureAlone/App/UITestMode.swift, DEBUG only): an in-memory
  # store with the demo library, a fresh install's settings, no iCloud, no network, silent Listen.
  # Run with the ScriptureAloneUITests scheme.
  ScriptureAloneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ScriptureAloneUITests
    dependencies:
      - target: ScriptureAlone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blainemiller.ScriptureAloneUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ScriptureAlone
        # XCTestCase's initializers are nonisolated; the tests mark themselves @MainActor.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  # UI tests for the Apple Watch app, with `-UITestMode` (the BSB edition, the demo library).
  ScriptureAloneWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: ScriptureAloneWatchUITests
    dependencies:
      - target: ScriptureAloneWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blainemiller.ScriptureAloneWatchUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ScriptureAloneWatch
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_USER_SCRIPT_SANDBOXING: NO

schemes:
  ScriptureAlone:
    build:
      targets:
        ScriptureAlone: all
        ScriptureAloneTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScriptureAloneTests
      commandLineArguments:
        "-inMemoryStore": true
    archive:
      config: Release
  ScriptureAloneWatch:
    build:
      targets:
        ScriptureAloneWatch: all
        ScriptureAloneWatchUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ScriptureAloneWatchUITests
    archive:
      config: Release
  # The iPhone/iPad UI tests, apart from the ScriptureAlone scheme's unit tests (which also run on
  # macOS, where these do not).
  ScriptureAloneUITests:
    build:
      targets:
        ScriptureAlone: all
        ScriptureAloneUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ScriptureAloneUITests
  ScriptureAloneWidgets:
    build:
      targets:
        ScriptureAloneWidgets: all
        ScriptureAlone: all
    run:
      config: Debug
      askForAppToLaunch: true
    archive:
      config: Release
