name: ScriptureAlone
options:
  bundleIdPrefix: com.blainemiller
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "26.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

settings:
  base:
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: "8ZVSPZYSVF"
    CODE_SIGN_STYLE: Automatic
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    # The xattr-strip postCompileScript needs script sandboxing off.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Intel Macs and Intel simulators are out of scope.
    "ARCHS[sdk=macosx*]": arm64
    "EXCLUDED_ARCHS[sdk=*simulator*]": x86_64

packages:
  # Shared feedback / rating / "other apps" kit.
  MillerKit:
    url: https://github.com/blaineam/MillerKit
    from: "1.3.1"
  ScriptureAloneCore:
    path: ScriptureAloneCore

targets:
  ScriptureAlone:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ScriptureAlone
        excludes:
          - "Resources/Info.plist"
          - "Resources/*.entitlements"
          # Tagged below as on-demand resources, so they must not also be swept in here —
          # a file listed twice is embedded twice.
          - "Resources/Study/Study.sqlite"
          - "Resources/Study/Interlinear.sqlite"
          # The American Standard Version ships sealed, so its store stays out of the app; it is
          # kept in the repository as the source the packaging tool reads.
          - "Resources/Bibles/ASV.sqlite"
      # The two study databases are NOT here. They ship as Apple-hosted Background Assets packs,
      # uploaded to App Store Connect separately from the build (see Tools/asset-packs/README.md),
      # and are fetched and copied into Application Support when a reader opens Commentary or
      # Original Languages. Reading never depends on them: all three translations, the maps, the
      # timeline and the cross references stay in the app, so a fresh install reads scripture
      # offline with no network at all.
      # The encrypted demonstration package: a public-domain translation shipped exactly the way a
      # licensed one would be, so the whole chain — download, Enclave-sealed key, per-chapter
      # decryption, sealed search index, policy enforcement — can be watched running in the app
      # without anyone granting a licence first.
    dependencies:
      - package: MillerKit
      - package: ScriptureAloneCore
        product: ScriptureAloneCore
      # Home/Lock Screen and Mac desktop widgets (embedded on both platforms).
      - target: ScriptureAloneWidgets
      - target: ScriptureAloneAssets
      # The Apple Watch app rides inside the iOS app only.
      - target: ScriptureAloneWatch
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blainemiller.ScriptureAlone
        PRODUCT_NAME: Scripture Alone
        INFOPLIST_FILE: ScriptureAlone/Resources/Info.plist
        # The Icon Composer document ScriptureAlone/Resources/AppIcon.icon
        # (picked up by the `ScriptureAlone` source path; its layers come from
        # Tools/generate_icon.py). A watchOS target reuses it by listing the
        # same file in its sources with this same setting.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        # Mac users get the iPad app ("Designed for iPad") — no macOS platform in App Store Connect.
        # The native macOS destination stays buildable so its code does not rot, but it is not shipped.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_ENTITLEMENTS: ScriptureAlone/Resources/ScriptureAlone.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": ScriptureAlone/Resources/ScriptureAlone-macOS.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
    postCompileScripts:
      - name: Strip xattrs (codesign workaround)
        # Must run on EVERY build: iCloud Documents re-tags files with
        # com.apple.provenance between builds, and a stamp-file output lets
        # Xcode skip this phase on incremental builds while codesign still
        # reruns — which then fails with "resource fork, Finder information,
        # or similar detritus not allowed".
        basedOnDependencyAnalysis: false
        script: |
          find "$CODESIGNING_FOLDER_PATH" -exec xattr -c {} + 2>/dev/null
          true

  # Widgets for iOS (Home + Lock Screen) and macOS (desktop / Notification Center). They read
  # the bundled Verse of the Day list and the JSON snapshot the app writes to the App Group;
  # they never open the Bible databases or the SwiftData store.
  # The Background Assets downloader extension. It has no behaviour — adopting
  # `StoreDownloaderExtension` opts into the system's own downloader — but the framework requires
  # it to exist, and `AssetPackManager` treats its absence as a programmer error.
  ScriptureAloneAssets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ScriptureAloneAssets
        excludes:
          - "Info.plist"
    dependencies:
      - sdk: BackgroundAssets.framework
      - sdk: StoreKit.framework
    info:
      path: ScriptureAloneAssets/Info.plist
      properties:
        CFBundleDisplayName: Scripture Alone Assets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.background-asset-downloader-extension
          EXPrincipalClass: $(PRODUCT_MODULE_NAME).AssetDownloader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blainemiller.ScriptureAlone.assets
        PRODUCT_NAME: ScriptureAloneAssets
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    postCompileScripts:
      - name: Strip xattrs (codesign workaround)
        basedOnDependencyAnalysis: false
        script: |
          find "$CODESIGNING_FOLDER_PATH" -exec xattr -c {} + 2>/dev/null
          true

  ScriptureAloneWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ScriptureAloneWidgets
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - ScriptureAlone/Shared/AppGroup.swift
      - ScriptureAlone/Shared/DailyVerseLibrary.swift
      - ScriptureAlone/Shared/DailyVerses.json
    dependencies:
      - package: ScriptureAloneCore
        product: ScriptureAloneCore
    info:
      path: ScriptureAloneWidgets/Info.plist
      properties:
        CFBundleDisplayName: Scripture Alone
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ScriptureAloneWidgets/ScriptureAloneWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.blainemiller.ScriptureAlone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blainemiller.ScriptureAlone.Widgets
        PRODUCT_NAME: ScriptureAloneWidgets
        # Timeline providers and intents run off the main actor; views stay @MainActor via View.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
    postCompileScripts:
      - name: Strip xattrs (codesign workaround)
        basedOnDependencyAnalysis: false
        script: |
          find "$CODESIGNING_FOLDER_PATH" -exec xattr -c {} + 2>/dev/null
          true

  # Apple Watch app (watchOS 26+), standalone-capable. Bundles a compact ASV
  # (Tools/build_companion_data.py) and syncs favorites, highlights and notes through the same
  # private CloudKit container as the phone via SwiftData — it shares Models.swift so the
  # schema is identical.
  ScriptureAloneWatch:
    type: application
    platform: watchOS
    sources:
      - path: ScriptureAloneWatch
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - ScriptureAlone/Persistence/Models.swift
      - ScriptureAlone/Shared/DemoLibrary.swift
      - ScriptureAlone/Shared/DailyVerseLibrary.swift
      - ScriptureAlone/Shared/DailyVerses.json
      - ScriptureAloneWidgets/VerseStyling.swift
      # The same Icon Composer document as the phone and Mac; it declares watchOS circles.
      - ScriptureAlone/Resources/AppIcon.icon
      - ScriptureAlone/Resources/Assets.xcassets
    dependencies:
      - package: ScriptureAloneCore
        product: ScriptureAloneCore
      - target: ScriptureAloneWatchWidgets
      # Without it the App Intents metadata step warns "no AppIntents.framework dependency".
      - sdk: AppIntents.framework
    info:
      path: ScriptureAloneWatch/Info.plist
      properties:
        CFBundleDisplayName: Scripture Alone
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.blainemiller.ScriptureAlone
        WKRunsIndependentlyOfCompanionApp: true
        CFBundleURLTypes:
          - CFBundleURLName: com.blainemiller.ScriptureAlone.watchkitapp
            CFBundleURLSchemes: [scripturealone]
        # Speak renders to a file and plays it with AVAudioPlayer; the watch speaker route
        # needs the audio background mode.
        UIBackgroundModes: [audio]
    entitlements:
      path: ScriptureAloneWatch/ScriptureAloneWatch.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.blainemiller.ScriptureAlone
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blainemiller.ScriptureAlone.watchkitapp
        PRODUCT_NAME: Scripture Alone
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    postCompileScripts:
      - name: Strip xattrs (codesign workaround)
        basedOnDependencyAnalysis: false
        script: |
          find "$CODESIGNING_FOLDER_PATH" -exec xattr -c {} + 2>/dev/null
          true

  # Watch face complications (WidgetKit accessory families).
  ScriptureAloneWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: ScriptureAloneWatchWidgets
        excludes:
          - "Info.plist"
      - ScriptureAloneWidgets/VerseOfDayShared.swift
      - ScriptureAloneWidgets/VerseStyling.swift
      - ScriptureAlone/Shared/DailyVerseLibrary.swift
      - ScriptureAlone/Shared/DailyVerses.json
    dependencies:
      - package: ScriptureAloneCore
        product: ScriptureAloneCore
    info:
      path: ScriptureAloneWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Scripture Alone
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blainemiller.ScriptureAlone.watchkitapp.Complications
        PRODUCT_NAME: ScriptureAloneWatchWidgets
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    postCompileScripts:
      - name: Strip xattrs (codesign workaround)
        basedOnDependencyAnalysis: false
        script: |
          find "$CODESIGNING_FOLDER_PATH" -exec xattr -c {} + 2>/dev/null
          true

schemes:
  ScriptureAlone:
    build:
      targets:
        ScriptureAlone: all
    run:
      config: Debug
    archive:
      config: Release
  ScriptureAloneWatch:
    build:
      targets:
        ScriptureAloneWatch: all
    run:
      config: Debug
    archive:
      config: Release
  ScriptureAloneWidgets:
    build:
      targets:
        ScriptureAloneWidgets: all
        ScriptureAlone: all
    run:
      config: Debug
      askForAppToLaunch: true
    archive:
      config: Release
