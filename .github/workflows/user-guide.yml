name: user-guide

# The User Guide: whenever docs/manual/ changes, builds per language (Tools/build_manual.py, headless
# Chrome on macOS, whose system fonts the template names) into dist/manual/:
#   - UserGuide-<code>.pdf — the website's download, and
#   - UserGuide-<code>.zip — guide.json + screenshots, which the apps download on demand and draw
#     natively (ScriptureAloneCore/Guide/UserGuide.swift; Android ui/guide), plus
#   - UserGuide-index.json — each zip's SHA-256, so an app re-downloads only a changed guide,
# and publishes them all as assets of the `user-guide` GitHub release:
#   https://github.com/blaineam/Scripture-Alone/releases/download/user-guide/<file>
# (codes: en, zh-Hans, ja, de, fr, es, ko, pt-BR, it). Nothing is committed and nothing is bundled
# in the apps. The release is never marked latest, so it doesn't stand in front of app releases.
#
# Run it by hand (workflow_dispatch) to republish without a source change.

on:
  push:
    branches: [main]
    paths:
      - "docs/manual/**"
      - "Tools/build_manual.py"
      - "Tools/manual_json.py"
      - ".github/workflows/user-guide.yml"
  workflow_dispatch:

permissions:
  contents: write  # the release assets

concurrency:
  group: user-guide
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the PDFs and packages
        run: python3 Tools/build_manual.py

      - name: Show what was built
        run: |
          ls -l dist/manual/
          {
            echo "### User Guide"
            echo "| File | Size |"; echo "|---|---|"
            for f in dist/manual/UserGuide-*; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to the user-guide release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view user-guide >/dev/null 2>&1; then
            gh release create user-guide --title "Scripture Alone User Guide" --latest=false \
              --notes "The illustrated Scripture Alone User Guide, one PDF per language: en, zh-Hans, ja, de, fr, es, ko, pt-BR, it. Rebuilt automatically from docs/manual/ whenever it changes; the same guide is inside the app under Aa › User Guide."
          fi
          # The packages and PDFs first, the index last: an app that reads the new index finds the
          # new package already there.
          gh release upload user-guide dist/manual/UserGuide-*.pdf dist/manual/UserGuide-*.zip --clobber
          gh release upload user-guide dist/manual/UserGuide-index.json --clobber
